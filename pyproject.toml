[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "cazavi-evidence-composite"
version = "0.1.0"
description = "Provenance-first reproducibility package for ceftazidime-avibactam evidence-composite PK/PD modeling"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Vahhab Piranfar"}]
dependencies = [
  "numpy>=2.0,<3",
  "pandas>=2.2,<3",
  "pydantic>=2.8,<3",
  "PyYAML>=6.0,<7",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2,<9",
  "pytest-cov>=5,<6",
  "ruff>=0.5,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/cazavi_model"]

[tool.pytest.ini_options]
addopts = "-q --strict-markers"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
